<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nodos — iPhone Mockup</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background:transparent;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}

.scene{perspective:1100px;perspective-origin:50% 42%}

.phone{
  --pw:min(390px, 90vw);
  --ph:calc(var(--pw) * 844 / 390);
  --pp:clamp(9px,3.3%,13px);
  --pr:clamp(40px,14.4%,56px);
  position:relative;
  width:calc(var(--pw) + var(--pp)*2);
  height:calc(var(--ph) + var(--pp)*2);
  background:linear-gradient(155deg,#333 0%,#1a1a1a 100%);
  border-radius:var(--pr);
  padding:var(--pp);
  box-shadow:
    inset 0 0 0 1.5px rgba(255,255,255,.14),
    inset 0 1px 0 rgba(255,255,255,.25),
    0 0 0 1px rgba(0,0,0,.9),
    0 48px 100px rgba(0,0,0,.75),
    0 16px 40px rgba(0,0,0,.55);
  transform-style:preserve-3d;
  animation:float 4s ease-in-out infinite;
  will-change:transform;
  transition:box-shadow .18s ease;
}
.phone.tilting{animation:none}

/* Volume left */
.phone::before{
  content:'';position:absolute;left:-4px;top:124px;
  width:4px;height:34px;background:#2a2a2a;border-radius:3px 0 0 3px;
  box-shadow:0 50px 0 #2a2a2a, 0 92px 0 #2a2a2a;
}
/* Power right */
.phone::after{
  content:'';position:absolute;right:-4px;top:176px;
  width:4px;height:76px;background:#2a2a2a;border-radius:0 3px 3px 0;
}

/* Screen */
.screen{
  width:100%;height:100%;
  border-radius:calc(var(--pr) - var(--pp) + 1px);
  overflow:hidden;
  background:transparent;
  position:relative;
}

/* Home indicator */
.hi{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  width:134px;height:5px;
  background:rgba(0,0,0,.25);border-radius:3px;
  z-index:10;pointer-events:none;
}

/* The GIF fills the screen exactly */
.screen img{
  display:block;
  width:100%;height:100%;
  object-fit:cover;
  object-position:top center;
}

@keyframes float{
  0%,100%{transform:translateY(0) rotateX(2deg)}
  50%    {transform:translateY(-16px) rotateX(2deg)}
}
</style>
</head>
<body>
<div class="scene">
  <div class="phone" id="phone">
    <div class="screen">
      <img src="image/nodos/nodos-gif.gif" alt="Nodos prototype">
      <div class="hi"></div>
    </div>
  </div>
</div>

<script>
const phone = document.getElementById('phone');
const scene = document.querySelector('.scene');

document.addEventListener('mousemove', e => {
  const r = scene.getBoundingClientRect();
  const dx = (e.clientX - r.left  - r.width /2) / (r.width /2);
  const dy = (e.clientY - r.top   - r.height/2) / (r.height/2);
  phone.classList.add('tilting');
  phone.style.transform = `rotateX(${(-dy*11).toFixed(1)}deg) rotateY(${(dx*9).toFixed(1)}deg)`;
  phone.style.boxShadow = `
    inset 0 0 0 1.5px rgba(255,255,255,.14),
    inset 0 1px 0 rgba(255,255,255,.25),
    0 0 0 1px rgba(0,0,0,.9),
    ${(-dx*22).toFixed(0)}px ${(dy*20+44).toFixed(0)}px 90px rgba(0,0,0,.78),
    0 12px 32px rgba(0,0,0,.5)`;
});

document.addEventListener('mouseleave', () => {
  phone.classList.remove('tilting');
  phone.style.transform = '';
  phone.style.boxShadow = '';
});
</script>
</body>
</html>
