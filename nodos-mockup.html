<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nodos — Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background:radial-gradient(ellipse at 55% 30%,#1e2e40 0%,#0c1018 70%);
  display:flex;align-items:center;justify-content:center;
  font-family:'Inter',system-ui,sans-serif;
  overflow:hidden;
}

/* ── SCENE / PHONE ── */
.scene{perspective:1100px;perspective-origin:50% 42%}
.phone{
  --pw:375px;--ph:812px;--pr:54px;--pp:11px;
  position:relative;
  width:calc(var(--pw) + var(--pp)*2);
  height:calc(var(--ph) + var(--pp)*2);
  background:linear-gradient(155deg,#333 0%,#191919 100%);
  border-radius:var(--pr);
  padding:var(--pp);
  box-shadow:
    inset 0 0 0 1.5px rgba(255,255,255,.14),
    inset 0 1px 0 rgba(255,255,255,.25),
    0 0 0 1px rgba(0,0,0,.9),
    0 48px 90px rgba(0,0,0,.75),
    0 16px 36px rgba(0,0,0,.55);
  transform-style:preserve-3d;
  animation:float 4s ease-in-out infinite;
  will-change:transform;
  transition:box-shadow .18s ease;
}
.phone.tilting{animation:none}
/* Left buttons */
.phone::before{
  content:'';position:absolute;left:-4px;top:120px;
  width:4px;height:34px;background:#2c2c2c;border-radius:3px 0 0 3px;
  box-shadow:0 48px 0 #2c2c2c,0 88px 0 #2c2c2c;
}
/* Right power */
.phone::after{
  content:'';position:absolute;right:-4px;top:170px;
  width:4px;height:72px;background:#2c2c2c;border-radius:0 3px 3px 0;
}

/* ── SCREEN ── */
.sw{
  width:100%;height:100%;
  border-radius:calc(var(--pr) - var(--pp) + 1px);
  overflow:hidden;background:#FAF7F2;position:relative;
}
.di{/* dynamic island */
  position:absolute;top:12px;left:50%;transform:translateX(-50%);
  width:120px;height:36px;background:#000;border-radius:20px;z-index:30;
}
.hi{/* home indicator */
  position:absolute;bottom:7px;left:50%;transform:translateX(-50%);
  width:130px;height:5px;background:rgba(0,0,0,.2);border-radius:3px;z-index:30;
}

/* ── CANVAS 375×812 ── */
.app{
  position:absolute;inset:0;
  background:#FAF7F2;
  display:flex;flex-direction:column;
  overflow:hidden;
}

/* STATUS BAR */
.sbar{
  height:52px;padding:14px 20px 0;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.stime{font-size:15px;font-weight:700;color:#111;letter-spacing:.01em}
.sicons{display:flex;align-items:center;gap:6px}

/* MAIN SCROLL AREA */
.body{flex:1;padding:0 20px;overflow:hidden;display:flex;flex-direction:column;gap:0}

/* GREETING */
.greet-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0 4px}
.greet{font-size:26px;font-weight:800;color:#111;letter-spacing:-.03em}
.trophy{font-size:26px;line-height:1}

/* SECTION LABEL */
.sec-lbl{font-size:10px;font-weight:600;color:#9E9E9E;letter-spacing:.12em;text-transform:uppercase;padding:10px 0 10px}

/* ACTIVITY BUTTONS */
.acts{display:flex;gap:10px;padding-bottom:14px}
.abt{
  flex:1;aspect-ratio:1/1;border-radius:16px;
  border:2px solid #2B5FD9;background:#fff;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .3s,border-color .3s;
}
.abt.on{background:#2B5FD9;border-color:#2B5FD9}
.abt svg{display:block;transition:none}

/* ACTIVITY INFO */
.act-info{padding-bottom:10px;min-height:52px}
.act-name{font-size:15px;font-weight:700;color:#2B5FD9;margin-bottom:3px;transition:opacity .3s}
.act-desc{font-size:12px;font-weight:400;color:#555;line-height:1.4;transition:opacity .3s}

/* ICA WIDGET */
.ica-wrap{
  position:relative;
  width:220px;height:220px;
  align-self:center;
  margin:2px auto 8px;
  flex-shrink:0;
}
/* warm glow behind */
.ica-glow{
  position:absolute;top:50%;left:50%;
  width:260px;height:260px;
  transform:translate(-50%,-50%);
  background:radial-gradient(ellipse,rgba(255,210,120,.55) 0%,rgba(255,230,160,.22) 45%,transparent 68%);
  border-radius:50%;filter:blur(18px);pointer-events:none;
}
/* spinning ring */
.ica-ring{
  position:absolute;inset:0;
  animation:spin 22s linear infinite;
  transform-origin:50% 50%;
  will-change:transform;
}
/* white disc + gauge */
.ica-disc{
  position:absolute;
  top:50%;left:50%;
  width:140px;height:140px;
  transform:translate(-50%,-50%);
  background:#fff;border-radius:50%;
  box-shadow:0 4px 24px rgba(0,0,0,.08);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
}
.ica-gauge{position:absolute;inset:0}
.ica-num{font-size:48px;font-weight:800;color:#111;letter-spacing:-.04em;line-height:1;position:relative;z-index:2}
.ica-lbl{font-size:11px;font-weight:500;color:#9E9E9E;letter-spacing:.08em;position:relative;z-index:2}

/* STATS ROW */
.stats{
  display:flex;justify-content:space-around;align-items:center;
  padding:8px 0 10px;border-top:1px solid rgba(0,0,0,.07);
  flex-shrink:0;
}
.stat{display:flex;align-items:center;gap:6px}
.stat-val{font-size:12px;font-weight:500;color:#444}

/* BOTTOM NAV */
.bnav{
  height:72px;padding:0 10px;padding-bottom:8px;
  border-top:1px solid rgba(0,0,0,.07);
  display:flex;align-items:center;justify-content:space-around;
  background:#FAF7F2;flex-shrink:0;
}
.bi{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.bi span{font-size:10px;font-weight:500;color:#9E9E9E}
.bi.on span{color:#2B5FD9}

/* ANIMATIONS */
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes float{
  0%,100%{transform:translateY(0) rotateX(2.5deg)}
  50%    {transform:translateY(-16px) rotateX(2.5deg)}
}
</style>
</head>

      <!-- White disc with gauge -->

<script>
const DATA = [
  { name:'Ciclismo',  desc:'Si decides salir a pedalear, ¡Ten cuidado al planificar tu ruta!', aqi:75, temp:'20°C', hum:'76% hum', pol:'1 bajo',  arc:.65 },
  { name:'Sprint',    desc:'Buenas condiciones para correr. Evita las horas de mayor tráfico.', aqi:52, temp:'21°C', hum:'71% hum', pol:'2 medio', arc:.42 },
  { name:'Salud',     desc:'La calidad del aire puede afectar tu bienestar. Toma precauciones.', aqi:88, temp:'22°C', hum:'68% hum', pol:'3 alto',  arc:.80 },
  { name:'Natura',    desc:'Excelente día para actividades al aire libre en zonas verdes.',       aqi:38, temp:'19°C', hum:'80% hum', pol:'1 bajo',  arc:.28 },
];

const btns    = [0,1,2,3].map(i => document.getElementById('b'+i));
const actName = document.getElementById('act-name');
const actDesc = document.getElementById('act-desc');
const icaN    = document.getElementById('ica-n');
const garc    = document.getElementById('garc');
const gdot    = document.getElementById('gdot');
const stTemp  = document.getElementById('st-temp');
const stHum   = document.getElementById('st-hum');
const stPol   = document.getElementById('st-pol');

let cur = 0;

function goTo(i) {
  const d = DATA[i];
  btns.forEach((b,j) => b.classList.toggle('on', j===i));

  // swap icon colors
  btns.forEach((b,j) => {
    b.querySelectorAll('path,circle,line,rect').forEach(el => {
      const isStroke = el.getAttribute('stroke') && el.getAttribute('stroke') !== 'none' && !el.getAttribute('fill')?.startsWith('#');
      if(j === i) {
        if(el.getAttribute('fill') && el.getAttribute('fill') !== 'none') el.setAttribute('fill','white');
        if(el.getAttribute('stroke') && el.getAttribute('stroke') !== 'none') el.setAttribute('stroke','white');
      } else {
        if(el.getAttribute('fill') && el.getAttribute('fill') !== 'none' && el.getAttribute('fill') !== 'white') {} // already right color
        if(el.getAttribute('stroke') === 'white') el.setAttribute('stroke','#2B5FD9');
        if(el.getAttribute('fill') === 'white') el.setAttribute('fill','#2B5FD9');
      }
    });
  });

  actName.textContent = d.name;
  actDesc.textContent = d.desc;
  icaN.textContent    = d.aqi;
  stTemp.textContent  = d.temp;
  stHum.textContent   = d.hum;
  stPol.textContent   = d.pol;

  // gauge arc
  const r = 56, circ = 2*Math.PI*r;
  const sweep = circ * 0.75;
  const fill  = sweep * d.arc;
  const gap   = circ - fill;
  const off   = -(circ * 0.375);
  garc.setAttribute('stroke-dasharray', `${fill.toFixed(1)} ${gap.toFixed(1)}`);
  garc.setAttribute('stroke-dashoffset', off.toFixed(1));

  // dot
  const startA = -225 * Math.PI/180;
  const endA   = startA + (270*Math.PI/180)*d.arc;
  const cx=70, cy=70;
  gdot.setAttribute('cx', (cx + r*Math.cos(endA)).toFixed(1));
  gdot.setAttribute('cy', (cy + r*Math.sin(endA)).toFixed(1));

  cur = i;
}

goTo(0);
setInterval(() => goTo((cur+1) % DATA.length), 2500);

// ── TILT ──
const phone = document.getElementById('phone');
const scene = document.querySelector('.scene');

document.addEventListener('mousemove', e => {
  const r = scene.getBoundingClientRect();
  const dx = (e.clientX - r.left  - r.width /2) / (r.width /2);
  const dy = (e.clientY - r.top   - r.height/2) / (r.height/2);
  phone.classList.add('tilting');
  phone.style.transform = `rotateX(${(-dy*11).toFixed(1)}deg) rotateY(${(dx*9).toFixed(1)}deg)`;
  phone.style.boxShadow = `
    inset 0 0 0 1.5px rgba(255,255,255,.14),
    inset 0 1px 0 rgba(255,255,255,.25),
    0 0 0 1px rgba(0,0,0,.9),
    ${(-dx*20).toFixed(0)}px ${(dy*18+42).toFixed(0)}px 80px rgba(0,0,0,.75),
    0 12px 30px rgba(0,0,0,.5)`;
});
document.addEventListener('mouseleave', () => {
  phone.classList.remove('tilting');
  phone.style.transform = '';
  phone.style.boxShadow = '';
});
</script>
</body>
</html>
