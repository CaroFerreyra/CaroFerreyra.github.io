<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nodos — Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background:radial-gradient(ellipse at 60% 30%,#1b2a3b 0%,#0d1117 70%);
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk',system-ui,sans-serif;
  overflow:hidden;
}

/* ── SCENE ── */
.scene{perspective:1200px;perspective-origin:50% 40%}

/* ── iPHONE 16 ── */
.phone{
  --sw:360px;
  --sh:780.6px;
  --pad:13px;
  --r:56px;
  position:relative;
  width:calc(var(--sw) + var(--pad)*2);
  height:calc(var(--sh) + var(--pad)*2);
  background:linear-gradient(160deg,#2e2e2e 0%,#1a1a1a 100%);
  border-radius:var(--r);
  padding:var(--pad);
  box-shadow:
    inset 0 0 0 1.5px rgba(255,255,255,.13),
    inset 0 1px 0 rgba(255,255,255,.22),
    0 0 0 1px rgba(0,0,0,.85),
    0 40px 80px rgba(0,0,0,.7),
    0 12px 32px rgba(0,0,0,.5);
  transform-style:preserve-3d;
  animation:float-phone 4s ease-in-out infinite;
  will-change:transform;
  transition:box-shadow .2s ease;
}
.phone.tilting{animation:none}

/* Volume up/down left */
.phone::before{
  content:"";position:absolute;
  left:-4px;top:118px;
  width:4px;height:36px;
  background:#2a2a2a;border-radius:3px 0 0 3px;
  box-shadow:0 50px 0 #2a2a2a,0 92px 0 #2a2a2a;
}
/* Power right */
.phone::after{
  content:"";position:absolute;
  right:-4px;top:168px;
  width:4px;height:76px;
  background:#2a2a2a;border-radius:0 3px 3px 0;
}

/* ── SCREEN BEZEL ── */
.screen-wrap{
  width:100%;height:100%;
  border-radius:calc(var(--r) - var(--pad) + 1px);
  overflow:hidden;
  background:#000;
  position:relative;
}

/* Dynamic Island */
.d-island{
  position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:118px;height:34px;
  background:#000;border-radius:20px;
  z-index:30;pointer-events:none;
}
/* Home indicator */
.home-ind{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  width:134px;height:5px;
  background:rgba(0,0,0,.32);border-radius:3px;
  z-index:30;pointer-events:none;
}

/* ── SCREEN CANVAS 393×852 → scaled to 360px ── */
.sc{
  position:absolute;inset:0;
  width:393px;height:852px;
  transform-origin:top left;
  transform:scale(0.91603);
  background:#fff;
  overflow:hidden;
}

/* ── STATUS BAR ── */
.sbar{
  position:absolute;top:16px;left:26px;right:20px;
  height:28px;display:flex;align-items:center;justify-content:space-between;
}
.sbar-time{
  font-family:'Space Mono',monospace;
  font-size:15px;font-weight:700;color:#1a1a1a;letter-spacing:.01em;
}
.sbar-icons{display:flex;align-items:center;gap:6px}

/* ── APP HEADER ── */
.app-hdr{
  position:absolute;top:82px;left:22px;right:22px;
  display:flex;align-items:center;justify-content:space-between;
}
.app-name{
  font-family:'Space Mono',monospace;
  font-size:11px;font-weight:700;
  letter-spacing:.22em;color:#303030;text-transform:uppercase;
}

/* ── LOCATION ROW ── */
.loc-row{
  position:absolute;top:116px;left:22px;
  display:flex;align-items:center;gap:5px;
}
.loc-dot{width:6px;height:6px;border-radius:50%;background:#255BC7;flex-shrink:0}
.loc-txt{font-size:9.5px;font-weight:500;color:#8E8E8E;letter-spacing:.07em;text-transform:uppercase}

/* ── ACTIVITY BUTTONS ── */
.act-row{
  position:absolute;top:148px;left:21px;right:21px;
  display:flex;justify-content:space-between;
}
.act-btn{
  width:74px;height:74px;border-radius:15px;
  border:2px solid #255BC7;
  background:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;cursor:pointer;
  transition:background .3s,border-color .3s;
  padding:0;
}
.act-btn.active{background:#255BC7}
.act-btn svg path{fill:#255BC7;transition:fill .3s}
.act-btn.active svg path{fill:#fff}
.act-lbl{
  font-size:8px;font-weight:700;color:#255BC7;
  letter-spacing:.07em;text-transform:uppercase;
  line-height:1;transition:color .3s;
  font-family:'Space Mono',monospace;
}
.act-btn.active .act-lbl{color:#fff}

/* ── ICA LABELS ── */
.ica-type{
  position:absolute;top:242px;left:22px;
  font-family:'Space Mono',monospace;
  font-size:10px;font-weight:700;
  color:#255BC7;letter-spacing:.1em;text-transform:uppercase;
}
.ica-street{
  position:absolute;top:260px;left:22px;right:22px;
  font-size:17px;font-weight:700;color:#1a1a1a;
  letter-spacing:-.02em;line-height:1.25;
}

/* ── ICA WIDGET ── */
.ica-widget{
  position:absolute;top:318px;left:69px;
  width:255.374px;height:248.369px;
}
.ica-glow{
  position:absolute;inset:-38%;
  background:radial-gradient(ellipse,rgba(255,204,102,.42) 0%,rgba(255,224,178,.22) 42%,transparent 68%);
  border-radius:50%;
  filter:blur(30px);
  pointer-events:none;
}
.ica-ring{
  position:absolute;inset:0;width:100%;height:100%;
  animation:spin-ring 20s linear infinite;
  transform-origin:50% 50%;
  will-change:transform;
}
.ica-frame{
  position:absolute;
  top:41px;left:47px;
  width:161.4px;height:165.6px;
}
.ica-frame-svg{
  position:absolute;inset:0;width:100%;height:100%;
  overflow:visible;
}
.ica-info{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:0;padding-top:8px;
}
.ica-num{
  font-family:'Space Grotesk',sans-serif;
  font-size:48px;font-weight:700;color:#1a1a1a;
  line-height:.88;letter-spacing:-.04em;
}
.ica-sub{
  font-size:9px;font-weight:500;color:#9E9E9E;
  letter-spacing:.1em;text-transform:uppercase;margin-top:5px;
}
.ica-cat{
  font-family:'Space Mono',monospace;
  font-size:8px;font-weight:700;color:#D17D00;
  letter-spacing:.14em;text-transform:uppercase;margin-top:2px;
}

/* ── BOTTOM BAR ── */
.bot-bar{
  position:absolute;top:744px;left:0;right:0;height:108px;
  background:linear-gradient(0deg,#fff 55%,rgba(255,255,255,0));
  display:flex;align-items:flex-start;justify-content:space-around;
  padding:6px 16px 0;
}
.bot-item{display:flex;align-items:center;gap:6px}
.bot-lbl{font-size:8px;font-weight:500;color:#9E9E9E;letter-spacing:.05em;text-transform:uppercase;line-height:1.3}
.bot-val{font-family:'Space Mono',monospace;font-size:10px;font-weight:700;color:#303030;letter-spacing:.03em}

/* ── ANIMATIONS ── */
@keyframes spin-ring{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes float-phone{
  0%,100%{transform:translateY(0) rotateX(2deg)}
  50%    {transform:translateY(-14px) rotateX(2deg)}
}
</style>
</head>

<script>
const SCREENS = [
  { btnIdx:0, type:'CiclCl',  street:'C/ Barceloneta, 23',  aqi:53, cat:'Moderado', arc:.58 },
  { btnIdx:1, type:'Sprint',  street:'Pg. Marítim, 5',      aqi:47, cat:'Bueno',    arc:.46 },
  { btnIdx:2, type:'Salud',   street:'C/ de la Marina, 12', aqi:63, cat:'Alto',     arc:.70 },
  { btnIdx:3, type:'Natura',  street:'Av. del Litoral, 90', aqi:38, cat:'Bueno',    arc:.36 },
];

const btns      = [0,1,2,3].map(i => document.getElementById('btn-'+i));
const aqiNum    = document.getElementById('aqi-num');
const aqiCat    = document.getElementById('aqi-cat');
const icaType   = document.getElementById('ica-type');
const icaStreet = document.getElementById('ica-street');
const gaugeFill = document.getElementById('gauge-fill');
const gaugeDot  = document.getElementById('gauge-dot');

let cur = 0;

function setScreen(i) {
  const s = SCREENS[i];
  btns.forEach((b,j) => b.classList.toggle('active', j === i));
  aqiNum.textContent    = s.aqi;
  aqiCat.textContent    = s.cat;
  icaType.textContent   = s.type;
  icaStreet.textContent = s.street;

  // Gauge: 270° sweep, starts at -135° (bottom-left)
  const r    = 60;
  const circ = 2 * Math.PI * r;          // ≈ 376.99
  const sweep = circ * 0.75;             // 270° portion ≈ 282.7
  const fill  = sweep * s.arc;
  const gap   = circ - fill;
  const offset = -(circ * 0.375);        // start offset for -135°
  gaugeFill.setAttribute('stroke-dasharray', `${fill.toFixed(2)} ${gap.toFixed(2)}`);
  gaugeFill.setAttribute('stroke-dashoffset', offset.toFixed(2));

  // Dot position at end of arc
  const startRad = -135 * Math.PI / 180;
  const endRad   = startRad + (270 * Math.PI / 180) * s.arc;
  const cx = 80.7, cy = 82.8;
  gaugeDot.setAttribute('cx', (cx + r * Math.cos(endRad)).toFixed(2));
  gaugeDot.setAttribute('cy', (cy + r * Math.sin(endRad)).toFixed(2));

  cur = i;
}

setScreen(0);
setInterval(() => setScreen((cur + 1) % SCREENS.length), 2500);

// ── TILT 3D ──
const phone = document.getElementById('phone');
const scene = document.querySelector('.scene');

document.addEventListener('mousemove', e => {
  const rect = scene.getBoundingClientRect();
  const dx = (e.clientX - rect.left  - rect.width  / 2) / (rect.width  / 2);
  const dy = (e.clientY - rect.top   - rect.height / 2) / (rect.height / 2);
  phone.classList.add('tilting');
  phone.style.transform = `rotateX(${(-dy * 12).toFixed(1)}deg) rotateY(${(dx * 10).toFixed(1)}deg)`;
  const sx = -dx * 22, sy = (-dy * 20 + 44);
  phone.style.boxShadow = `
    inset 0 0 0 1.5px rgba(255,255,255,.13),
    inset 0 1px 0 rgba(255,255,255,.22),
    0 0 0 1px rgba(0,0,0,.85),
    ${sx}px ${sy}px 80px rgba(0,0,0,.72),
    0 12px 32px rgba(0,0,0,.5)`;
});

document.addEventListener('mouseleave', () => {
  phone.classList.remove('tilting');
  phone.style.transform = '';
  phone.style.boxShadow = '';
});
</script>
