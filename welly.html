<script>
class Component {
  renderVals() { return {}; }

  componentDidMount() {
    this.props = {};
    document.documentElement.style.background = 'var(--bg)';
    document.body.style.background = 'var(--bg)';
    document.body.style.color = 'var(--text)';
    this.reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const qs = new URLSearchParams(location.search);
    this.id = 'welly';
    this.lang = qs.get('lang') || localStorage.getItem('cf_tpl_lang') || 'en';
    this.theme = qs.get('theme') || localStorage.getItem('cf_tpl_theme') || 'dark';
    this.CASES = window.CF_CASES || {};
    this.NAV = { es:{nav_works:'Trabajos',nav_about:'Sobre mí',nav_contact:'Contacto',c_cv:'Ver CV',overview:'Overview',f_made:'Diseñado con ✦'},
                 en:{nav_works:'Works',nav_about:'About',nav_contact:'Contact',c_cv:'View CV',overview:'Overview',f_made:'Designed with ✦'} };
    this.applyAccent();
    this.applyTheme(this.theme);
    this.initSky();
    this.render();
    this.applyLang(this.lang);
    this.bindToggles();
    this.initBotnav();
    this.initCursor();
    this.initNav();
    this.initLightbox();
  }

  bindThumbs() {
    document.querySelectorAll('.cf-thumb, .cf-3d-expand, .cf-browser__expand, .cf-screen').forEach(btn => {
      if (btn._lb) return; btn._lb = true;
      btn.addEventListener('click', () => this.openLightbox(+btn.dataset.idx));
    });
    this.init3D();
    this.initDeckCompare();
    this.initCompareHint();
    this.initBrowserSvg();
    this.initParallax();
    this.initPhones();
    this.initDesktop();
  }

  // Figma stripped the embedded rasters from these SVG exports — fill those
  // image regions with a soft brand-tinted placeholder so they don't read as broken.
  fillSvgImages(txt) {
    const grad = '<defs><linearGradient id="cf-imgfill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dcefe8"/><stop offset="1" stop-color="#f6e2ee"/></linearGradient></defs>';
    txt = txt.replace(/<svg([^>]*)>/, (m, a) => `<svg${a}>${grad}`);
    txt = txt.replace(/url\(#pattern[0-9A-Za-z_]+\)/g, 'url(#cf-imgfill)');
    return txt;
  }

  initPhones() {
    document.querySelectorAll('.cf-phone__page').forEach((page) => {
      if (page._init) return; page._init = true;
      if (this.reduce) return;
      const screen = page.closest('.cf-phone__scroll') || page.parentElement;
      const getMax = () => Math.max(0, page.offsetHeight - screen.clientHeight) * 0.92; // stop short of the footer
      const start = () => this.attachScroll(screen, page, getMax, { secs: 13 });
      if (page.complete && page.naturalHeight) start();
      else page.addEventListener('load', start, { once: true });
    });
  }

  // Shared auto-scroll for the browser / phone mockups. Waits `startDelay` of no
  // interaction, then gently ping-pongs the page. Hovering freezes it and lets the
  // viewer scroll manually (wheel / touch); leaving re-arms the idle timer.
  attachScroll(el, mover, getMax, opts) {
    opts = opts || {};
    const secs = opts.secs || 18, startDelay = opts.startDelay || 4000, dwell = opts.dwell || 1400;
    const onFrame = opts.onFrame || null;
    let pos = 0, dir = 1, hovering = false, dwellUntil = 0, last = performance.now(), lastInteract = performance.now();
    el.addEventListener('mouseenter', () => { hovering = true; });
    el.addEventListener('mouseleave', () => { hovering = false; lastInteract = performance.now(); });
    el.addEventListener('wheel', (e) => {
      const max = getMax(); if (!max) return;
      if ((e.deltaY < 0 && pos <= 0.0005) || (e.deltaY > 0 && pos >= 0.9995)) return; // at an edge — let the page scroll through
      e.preventDefault();
      pos = Math.max(0, Math.min(1, pos + e.deltaY / max));
      lastInteract = performance.now();
    }, { passive: false });
    let ty = 0;
    el.addEventListener('touchstart', (e) => { ty = e.touches[0].clientY; lastInteract = performance.now(); }, { passive: true });
    el.addEventListener('touchmove', (e) => {
      const max = getMax(); if (!max) return;
      const cy = e.touches[0].clientY; pos = Math.max(0, Math.min(1, pos + (ty - cy) / max)); ty = cy;
      lastInteract = performance.now();
    }, { passive: true });
    const tick = (now) => {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (!el.dataset.freeze && !hovering && (now - lastInteract > startDelay) && now >= dwellUntil) {
        pos += dir * dt / secs;
        if (pos >= 1) { pos = 1; dir = -1; dwellUntil = now + dwell; }
        else if (pos <= 0) { pos = 0; dir = 1; dwellUntil = now + dwell; }
      }
      const max = getMax();
      mover.style.transform = `translateY(${(-pos * max).toFixed(1)}px)`;
      if (onFrame) onFrame(pos, max);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  // Turn the low-fi → hi-fi deck into a draggable before/after slider. The
  // ambient auto-wipe runs until the user grabs it, then they control the split.
  initDeckCompare() {
    document.querySelectorAll('.cf-deck, .cf-pcompare').forEach(deck => {
      if (deck._cmp) return; deck._cmp = true;
      const view = deck.querySelector('.cf-deck__view, .cf-pcompare__view');
      if (!view) return;
      const set = (clientX) => {
        const r = view.getBoundingClientRect();
        let p = (clientX - r.left) / r.width * 100;
        p = Math.max(2, Math.min(98, p));
        deck.style.setProperty('--split', p + '%');
      };
      const down = (e) => {
        deck.classList.add('is-grab');
        set(e.clientX);
        const move = (ev) => set(ev.clientX);
        const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); };
        addEventListener('pointermove', move);
        addEventListener('pointerup', up);
        e.preventDefault();
      };
      view.addEventListener('pointerdown', down);
    });
  }

  // Brief idle nudge so the viewer learns the divider is draggable. Plays once
  // per slider when it scrolls into view; skipped if the user already grabbed it.
  initCompareHint() {
    if (this.reduce) return;
    if (this._hintIO) this._hintIO.disconnect();
    this._hintIO = new IntersectionObserver((ents) => {
      ents.forEach(e => {
        if (!e.isIntersecting || e.target._hinted) return;
        e.target._hinted = true;
        if (e.target.classList.contains('is-grab')) return;
        e.target.classList.add('is-hint');
        e.target.addEventListener('animationend', () => e.target.classList.remove('is-hint'), { once: true });
      });
    }, { threshold: 0.55 });
    document.querySelectorAll('.cf-pcompare').forEach(el => this._hintIO.observe(el));
  }

  initDesktop() {
    document.querySelectorAll('.cf-deck__view[data-dsvg]').forEach(view => {
      if (view._init) return; view._init = true;
      fetch(view.dataset.dsvg).then(r => r.text()).then(txt => {
        txt = this.fillSvgImages(txt);
        const base = view.querySelector('.cf-deck__base'), lofi = view.querySelector('.cf-deck__lofi');
        if (base && !view.dataset.hifi) base.innerHTML = txt;
        if (lofi) lofi.innerHTML = txt;
        [base, lofi].forEach(l => { const s = l && l.querySelector('svg'); if (s) { s.removeAttribute('width'); s.removeAttribute('height'); } });
      }).catch(() => {});
    });
  }

  initParallax() {
    if (this._plxInit || this.reduce) return; this._plxInit = true;
    const cards = [...document.querySelectorAll('.cf-case-block')];
    const txt = document.querySelector('.cf-case-overview__text');
    const tag = document.querySelector('.cf-case-overview__tag');
    cards.forEach(c => c.style.willChange = 'transform');
    [txt, tag].forEach(e => { if (e) e.style.willChange = 'transform'; });
    const speeds = [0, 0.055, 0.028];
    const clamp = (v, m) => Math.max(-m, Math.min(m, v));
    let ticking = false;
    const update = () => {
      ticking = false;
      const mid = innerHeight / 2;
      cards.forEach((c, i) => {
        const sp = speeds[i % 3];
        if (!sp) { c.style.transform = ''; return; }
        const r = c.getBoundingClientRect();
        const delta = (r.top + r.height / 2) - mid;
        c.style.transform = `translateY(${clamp(-delta * sp, 70).toFixed(1)}px)`;
      });
      if (txt) { const r = txt.getBoundingClientRect(); const d = (r.top + r.height / 2) - mid; const o = clamp(-d * 0.16, 90); txt.style.transform = `translateY(${o.toFixed(1)}px)`; if (tag) tag.style.transform = `translateY(${(o * 0.55).toFixed(1)}px)`; }
    };
    const onScroll = () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } };
    addEventListener('scroll', onScroll, { passive: true });
    addEventListener('resize', onScroll, { passive: true });
    update();
  }

  async initBrowserSvg() {
    const pages = document.querySelectorAll('.cf-browser__page[data-svg]');
    for (const page of pages) {
      if (page._svgInit) continue; page._svgInit = true;
      try {
        const txt = await (await fetch(page.dataset.svg)).text();
        page.innerHTML = txt;
      } catch (e) { continue; }
      const svg = page.querySelector('svg');
      if (!svg) continue;
      svg.removeAttribute('width'); svg.removeAttribute('height');

      // Re-insert the Barcelona map (Figma dropped the embedded raster) as a layer over the empty map area
      if (page.dataset.map) {
        const layer = document.createElement('div');
        layer.className = 'cf-map-layer';
        layer.style.cssText = 'left:24.844%;top:10.829%;width:72.891%;height:30.146%;';
        const mimg = document.createElement('img');
        mimg.src = page.dataset.map; mimg.alt = '';
        layer.appendChild(mimg);
        page.appendChild(layer);
      }
      const paths = svg.querySelectorAll('path');
      const view = page.closest('.cf-browser__view');
      const thumb = view.querySelector('.cf-browser__scrollbar i');
      const card = page.closest('.cf-browser');

      // identify chart elements by document order
      const barIdx = [560,562,564,566,568,570,572,574,576,578, 598,600,602,604,606,608,610,612,614,616];
      const lineIdx = [684,692,700,708,716,723,731,739,769];
      const bars = barIdx.map(i => paths[i]).filter(Boolean);
      const lines = lineIdx.map(i => paths[i]).filter(Boolean);
      bars.forEach(b => { b.style.transformBox = 'fill-box'; b.style.transformOrigin = 'bottom'; b.style.transform = 'scaleY(0)'; });
      const lineLens = lines.map(l => { let L = 0; try { L = l.getTotalLength(); } catch (_) {} l.style.strokeDasharray = L; l.style.strokeDashoffset = L; return L; });

      if (this.reduce) {
        bars.forEach(b => b.style.transform = 'scaleY(1)');
        lines.forEach(l => l.style.strokeDashoffset = 0);
        continue;
      }

      const VB = 2547, clamp = (v,a,b) => Math.max(a, Math.min(b, v));
      const easeInOut = x => x < 0.5 ? 2*x*x : 1 - Math.pow(-2*x+2,2)/2;
      // scroll position 0..1 over the cycle (top → bottom → top with dwells)
      const sOf = t => {
        if (t < 0.06) return 0;
        if (t < 0.46) return easeInOut((t-0.06)/0.40);
        if (t < 0.56) return 1;
        if (t < 0.96) return 1 - easeInOut((t-0.56)/0.40);
        return 0;
      };
      const getMax = () => { const Hp = page.offsetHeight || (view.clientWidth * VB / 1590); return Math.max(0, Hp - view.clientHeight); };
      this.attachScroll(view, page, getMax, { secs: 20, onFrame: (pos, maxPx) => {
        if (thumb) thumb.style.top = (pos * 64).toFixed(2) + '%';
        const Hp = page.offsetHeight || (view.clientWidth * VB / 1590), Hv = view.clientHeight;
        const reveal = (cVb) => clamp((Hv - ((cVb/VB)*Hp - pos*maxPx)) / (Hv*0.55), 0, 1);
        const pb = reveal(1255), pl = reveal(1670);
        bars.forEach((b,i) => { const d = i*0.025; const v = clamp((pb-d)/(1-d||1),0,1); b.style.transform = `scaleY(${easeInOut(v).toFixed(3)})`; });
        lines.forEach((l,i) => { const d = i*0.04; const v = clamp((pl-d)/(1-d||1),0,1); l.style.strokeDashoffset = (lineLens[i]*(1-easeInOut(v))).toFixed(1); });
      }});
    }
  }

  init3D() {
    document.querySelectorAll('.cf-case-showcase').forEach(sc => {
      if (sc._3d) return; sc._3d = true;
      const obj = sc.querySelector('.cf-3d-obj');
      if (!obj) return;
      const reduce = this.reduce;
      let rx = 0, ry = 0, trx = 0, try_ = 0, raf = null, dragging = false, lx = 0, ly = 0;
      const clamp = (v, m) => Math.max(-m, Math.min(m, v));
      const paint = () => { obj.style.transform = `rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`; };
      const loop = () => {
        rx += (trx - rx) * 0.12; ry += (try_ - ry) * 0.12; paint();
        if (dragging || Math.abs(trx - rx) > 0.04 || Math.abs(try_ - ry) > 0.04) raf = requestAnimationFrame(loop);
        else raf = null;
      };
      const kick = () => { if (reduce) { rx = trx; ry = try_; paint(); return; } if (!raf) raf = requestAnimationFrame(loop); };
      sc.addEventListener('pointerdown', e => {
        if (e.target.closest('.cf-3d-expand')) return;
        dragging = true; lx = e.clientX; ly = e.clientY; sc.classList.add('is-grab');
        try { sc.setPointerCapture(e.pointerId); } catch (_) {}
      });
      sc.addEventListener('pointermove', e => {
        if (!dragging) return;
        const dx = e.clientX - lx, dy = e.clientY - ly; lx = e.clientX; ly = e.clientY;
        try_ = clamp(try_ + dx * 0.45, 40); trx = clamp(trx - dy * 0.45, 26); kick();
      });
      const end = () => { dragging = false; sc.classList.remove('is-grab'); };
      sc.addEventListener('pointerup', end);
      sc.addEventListener('pointercancel', end);
      sc.addEventListener('mousemove', e => {
        if (dragging) return;
        const r = sc.getBoundingClientRect();
        const px = (e.clientX - r.left) / r.width - 0.5, py = (e.clientY - r.top) / r.height - 0.5;
        try_ = px * 26; trx = -py * 15; kick();
      });
      sc.addEventListener('mouseleave', () => { if (dragging) return; trx = 0; try_ = 0; kick(); });
      paint();
    });
  }

  initLightbox() {
    if (this._lbInit) return; this._lbInit = true;
    const lb = document.getElementById('cf-lightbox');
    document.getElementById('cf-lb-close').addEventListener('click', () => this.closeLightbox());
    document.getElementById('cf-lb-prev').addEventListener('click', () => this.stepLightbox(-1));
    document.getElementById('cf-lb-next').addEventListener('click', () => this.stepLightbox(1));
    lb.addEventListener('click', e => { if (e.target === lb) this.closeLightbox(); });
    addEventListener('keydown', e => {
      if (!lb.classList.contains('is-open')) return;
      if (e.key === 'Escape') this.closeLightbox();
      else if (e.key === 'ArrowRight') this.stepLightbox(1);
      else if (e.key === 'ArrowLeft') this.stepLightbox(-1);
    });
  }

  openLightbox(idx) {
    if (!this.imgs || !this.imgs.length) return;
    this.lbIdx = idx;
    this.paintLightbox();
    document.getElementById('cf-lightbox').classList.add('is-open');
    document.body.style.overflow = 'hidden';
  }
  stepLightbox(dir) {
    const n = this.imgs.length;
    this.lbIdx = (this.lbIdx + dir + n) % n;
    this.paintLightbox();
  }
  paintLightbox() {
    const it = this.imgs[this.lbIdx];
    document.getElementById('cf-lb-img').src = it.src;
    document.getElementById('cf-lb-img').alt = it.alt || '';
    document.getElementById('cf-lb-cap').textContent = it.alt || '';
    document.getElementById('cf-lb-count').textContent = (this.lbIdx + 1) + ' / ' + this.imgs.length;
    const multi = this.imgs.length > 1;
    document.getElementById('cf-lb-prev').style.display = multi ? '' : 'none';
    document.getElementById('cf-lb-next').style.display = multi ? '' : 'none';
    document.getElementById('cf-lb-count').style.display = multi ? '' : 'none';
  }
  closeLightbox() {
    document.getElementById('cf-lightbox').classList.remove('is-open');
    document.body.style.overflow = '';
  }

  applyAccent() {
    const a = this.props.accent;
    // Only override when the user actually customised the accent — keep the
    // per-theme tokens otherwise (light mode keeps its success-blue).
    if (a && Array.isArray(a) && a[0] && a[0].toLowerCase() !== '#c8ff4c') {
      document.documentElement.style.setProperty('--lime-500', a[0]);
      if (a[1]) document.documentElement.style.setProperty('--mint-500', a[1]);
    }
  }

  data() { return this.CASES[this.id] || this.CASES.datalog; }

  render() {
    const d = this.data(); if (!d) return;
    const L = this.lang;
    document.getElementById('cf-c-index').textContent = '— ' + d.index;
    document.getElementById('cf-c-title').textContent = d.title;
    document.title = d.title + ' — Carolina Ferreyra';
    // tags
    document.getElementById('cf-c-tags').innerHTML = d.tags.map(t => `<span class="cf-tag">${t}</span>`).join('');
    // meta
    document.getElementById('cf-c-meta').innerHTML = d.meta.map(m => `
      <div class="cf-case-meta__row"><span class="cf-case-meta__l">${m.l[L]}</span><span class="cf-case-meta__v">${m.v[L]}</span></div>`).join('');
    // blocks — text in glass cards; consecutive images grouped into a thumbnail gallery (→ lightbox)
    this.imgs = [];
    d.blocks.forEach(b => {
      if (b.browser && b.full) this.imgs.push({ src: b.browser, alt: (b.alt && b.alt[L]) || '' });
      else if (b.browser) this.imgs.push({ src: b.browser, alt: (b.alt && b.alt[L]) || '' });
      else if (b.grid) b.grid.forEach(g => this.imgs.push({ src: g.src, alt: (g.label && g.label[L]) || '' }));
      else if (b.img) this.imgs.push({ src: b.img, alt: (b.alt && b.alt[L]) || '' });
    });
    const blocks = d.blocks;
    let out = '', i = 0, imgIdx = 0;
    while (i < blocks.length) {
      const b = blocks[i];
      if (b.phones) {
        const pos = ['cf-phone--l', 'cf-phone--c', 'cf-phone--r'];
        const dels = ['0s', '-2.2s', '-4.4s'];
        out += '<div class="cf-phones">';
        b.phones.forEach((ph, k) => {
          out += `<div class="cf-phone ${pos[k] || ''}"><div class="cf-phone__bezel" style="--del:${dels[k] || '0s'}"><div class="cf-phone__screen"><img class="cf-phone__page" src="${ph.src}" alt="" loading="lazy"><span class="cf-phone__glare"></span></div></div></div>`;
        });
        out += '</div>';
        i++;
      } else if (b.desktop) {
        out += `<div class="cf-deck"><div class="cf-deck__frame"><div class="cf-deck__chrome"><div class="cf-deck__dots"><i></i><i></i><i></i></div><div class="cf-deck__url">${b.url || ''}</div></div><div class="cf-deck__view" data-dsvg="${b.desktop}"${b.hifi ? ` data-hifi="${b.hifi}"` : ''}><div class="cf-deck__layer cf-deck__base">${b.hifi ? `<img src="${b.hifi}" alt="${(b.alt && b.alt[L]) || ''}" style="display:block;width:100%">` : ''}</div><div class="cf-deck__layer cf-deck__lofi"></div><div class="cf-deck__divider"><i></i><i></i></div><span class="cf-deck__tag cf-deck__tag--lo">${b.lo ? b.lo[L] : 'Low-fi'}</span><span class="cf-deck__tag cf-deck__tag--hi">${b.hi ? b.hi[L] : 'Hi-fi'}</span></div></div>${b.caption ? `<span class="cf-phone__label" style="margin-top:18px">${b.caption[L]}</span>` : ''}</div>`;
        i++;
      } else if (b.browser && b.full) {
        const idx = imgIdx++;
        const url = b.url || '';
        out += `<div class="cf-browser cf-browser--full"><div class="cf-browser__frame"><div class="cf-browser__chrome"><div class="cf-browser__dots"><i></i><i></i><i></i></div><div class="cf-browser__url"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>${url}</div></div><div class="cf-browser__view"><img class="cf-browser__page" src="${b.browser}" alt="${(b.alt && b.alt[L]) || ''}" loading="lazy"></div></div><button class="cf-browser__expand" data-idx="${idx}" aria-label="Ampliar imagen">⤢</button></div>`;
        i++;
      } else if (b.grid) {
        out += '<div class="cf-screengrid">';
        b.grid.forEach(g => {
          const idx = imgIdx++;
          out += `<button class="cf-screen" data-idx="${idx}" aria-label="Ampliar imagen"><span class="cf-screen__phone"><img src="${g.src}" alt="${(g.label && g.label[L]) || ''}" loading="lazy"></span>${g.label ? `<span class="cf-screen__label">${g.label[L]}</span>` : ''}</button>`;
        });
        out += '</div>';
        i++;
      } else if (b.compares || b.compare) {
        const list = b.compares || [b.compare];
        const loD = L === 'es' ? 'Baja' : 'Low-fi', hiD = L === 'es' ? 'Alta' : 'Hi-fi';
        out += `<div class="cf-pcompareset"><div class="cf-pcompareset__grid${list.length === 1 ? ' cf-pcompareset__grid--one' : ''}">`;
        list.forEach(c => {
          const loT = c.loLabel ? c.loLabel[L] : loD, hiT = c.hiLabel ? c.hiLabel[L] : hiD;
          out += `<div class="cf-pcompare" role="group" aria-label="${(c.alt && c.alt[L]) || ''} — ${loT} / ${hiT}"><div class="cf-pcompare__phone"><div class="cf-pcompare__view"><div class="cf-pcompare__layer cf-pcompare__base"><img src="${c.hi}" alt="${(c.alt && c.alt[L]) || ''}" loading="lazy" decoding="async"></div><div class="cf-pcompare__layer cf-pcompare__lofi"><img src="${c.lo}" alt="" loading="lazy" decoding="async"></div><div class="cf-pcompare__divider" aria-hidden="true"><i></i><i></i></div><span class="cf-pcompare__tag cf-pcompare__tag--lo" aria-hidden="true">${loT}</span><span class="cf-pcompare__tag cf-pcompare__tag--hi" aria-hidden="true">${hiT}</span></div></div>${c.label ? `<span class="cf-pcompare__label">${c.label[L]}</span>` : ''}</div>`;
        });
        out += '</div>';
        const cap = b.caption || (b.compare && b.compare.caption);
        if (cap) out += `<span class="cf-pcompareset__cap">${cap[L]}</span>`;
        out += '</div>';
        i++;
      } else if (b.illustrations) {
        i++;
      } else if (b.browser) {
        const idx = imgIdx++;
        const url = b.url || 'datalog.barcelona';
        const isSvg = /\.svg($|\?)/i.test(b.browser);
        const mapAttr = b.map ? ` data-map="${b.map}"` : '';
        const page = isSvg
          ? `<div class="cf-browser__page" data-svg="${b.browser}"${mapAttr} role="img" aria-label="${(b.alt && b.alt[L]) || ''}"></div>`
          : `<img class="cf-browser__page" src="${b.browser}" alt="${(b.alt && b.alt[L]) || ''}" loading="lazy">`;
        const cap = b.caption ? b.caption[L] : '';
        out += `<div class="cf-browser${b.small ? ' cf-browser--sm' : ''}"><div class="cf-browser__frame"><div class="cf-browser__chrome"><div class="cf-browser__dots"><i></i><i></i><i></i></div><div class="cf-browser__url"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>${url}</div></div><div class="cf-browser__view" data-anim="${isSvg ? 'js' : 'on'}">${page}<div class="cf-browser__scrollbar"><i></i></div></div></div><button class="cf-browser__expand" data-idx="${idx}" aria-label="Ampliar imagen">⤢</button>${cap ? `<p class="cf-case-p" style="margin-top:14px;color:var(--text-muted);font-size:13px;">${cap}</p>` : ''}</div>`;
        i++;
      } else if (b.img && b.showcase) {
        const idx = imgIdx++;
        const hint = L === 'es' ? 'Arrastra para girar' : 'Drag to rotate';
        out += `<div class="cf-case-showcase"><div class="cf-3d-scene"><div class="cf-3d-obj"><img src="${b.img}" alt="${(b.alt && b.alt[L]) || ''}" loading="lazy"></div></div><button class="cf-3d-expand" data-idx="${idx}" aria-label="Ampliar imagen">⤢</button><span class="cf-3d-hint">↺ ${hint}</span></div>`;
        i++;
      } else if (b.img) {
        const group = [];
        while (i < blocks.length && blocks[i].img && !blocks[i].showcase) { group.push(blocks[i]); i++; }
        out += `<div class="cf-case-gallery${group.length === 1 ? ' cf-case-gallery--single' : ''}">`;
        group.forEach(g => {
          const idx = imgIdx++;
          out += `<button class="cf-thumb" data-idx="${idx}" aria-label="Ampliar imagen"><img src="${g.img}" alt="${(g.alt && g.alt[L]) || ''}" loading="lazy"><span class="cf-thumb__zoom" aria-hidden="true">⤢</span></button>`;
        });
        out += '</div>';
      } else if (b.quote) {
        out += `<blockquote class="cf-case-quote">${b.quote[L]}</blockquote>`;
        i++;
      } else {
        let html = '<div class="cf-case-block">';
        if (b.h) html += `<h2 class="cf-case-h">${b.h[L]}</h2>`;
        if (b.p) html += b.p[L].map(par => `<p class="cf-case-p">${par}</p>`).join('');
        if (b.list) html += `<ul class="cf-case-list">${b.list[L].map(li => `<li>${li}</li>`).join('')}</ul>`;
        html += '</div>';
        out += html;
        i++;
      }
    }
    document.getElementById('cf-c-blocks').innerHTML = out;
    // A text card left alone on its row spans the full width (2-col grid).
    let run = [];
    const flush = () => { if (run.length % 2 === 1) run[run.length - 1].classList.add('cf-case-block--full'); run = []; };
    [...document.getElementById('cf-c-blocks').children].forEach(k => {
      if (k.classList.contains('cf-case-block')) run.push(k); else flush();
    });
    flush();
    this.bindThumbs();
    this.renderFoot(d);
  }

  renderFoot(d) {
    const L = this.lang;
    const foot = document.getElementById('cf-c-foot');
    const prevTxt = L === 'es' ? 'Proyecto anterior' : 'Previous project';
    const nextTxt = L === 'es' ? 'Próximo proyecto' : 'Next project';
    const link = (proj, dir) => proj ? `
      <a class="cf-case-foot__link cf-case-foot__link--${dir}" href="${proj.id}.html">
        <span class="cf-case-foot__dir">${dir === 'prev' ? '← ' + prevTxt : nextTxt + ' →'}</span>
        <span class="cf-case-foot__name">${proj.title}</span>
        <span class="cf-case-foot__sub">${proj.sub[L]}</span>
      </a>` : `<div class="cf-case-foot__empty"></div>`;
    foot.innerHTML = link(d.prev, 'prev') + link(d.next, 'next');
    this.rebindCursor();
  }

  applyLang(l) {
    this.lang = l;
    localStorage.setItem('cf_tpl_lang', l);
    document.documentElement.lang = l;
    const t = this.NAV[l];
    document.querySelectorAll('[data-k]').forEach(el => { const k = el.dataset.k; if (t[k] !== undefined) el.textContent = t[k]; });
    const es = document.getElementById('cf-lang-es'), en = document.getElementById('cf-lang-en');
    if (es) es.classList.toggle('is-active', l === 'es');
    if (en) en.classList.toggle('is-active', l === 'en');
    document.querySelectorAll('.cf-blang').forEach(b => b.classList.toggle('is-active', b.dataset.lang === l));
    const d = this.data();
    document.getElementById('cf-c-kicker').textContent = d.kicker[l];
    document.getElementById('cf-c-lede').textContent = d.lede[l];
    document.getElementById('cf-c-overview').textContent = d.overview[l];
    this.render();
  }

  applyTheme(th) {
    this.theme = th;
    localStorage.setItem('cf_tpl_theme', th);
    document.documentElement.setAttribute('data-theme', th);
  }

  initSky() {
    const stars = document.getElementById('cf-stars');
    if (stars && !stars.childElementCount) {
      let html = '';
      const N = this.reduce ? 40 : 90;
      for (let i = 0; i < N; i++) {
        const big = Math.random() < 0.16;
        const x = (Math.random() * 100).toFixed(2);
        const y = (Math.random() * 72).toFixed(2);
        const tw = (2.2 + Math.random() * 3.6).toFixed(2);
        const dl = (Math.random() * 4).toFixed(2);
        html += `<span class="cf-star${big ? ' cf-star--lg' : ''}" style="left:${x}%;top:${y}%;--tw:${tw}s;--dl:${dl}s;"></span>`;
      }
      stars.innerHTML = html;
    }
    const clouds = document.getElementById('cf-clouds');
    if (clouds && !clouds.childElementCount) {
      const grad = '<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>'
        + '<linearGradient id="cf-cloud-grad" x1="0" y1="0" x2="0" y2="1">'
        + '<stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#f2f7ff"/><stop offset="1" stop-color="#d4e6fb"/>'
        + '</linearGradient></defs></svg>';
      const svg = '<svg viewBox="0 0 232 132" preserveAspectRatio="xMidYMid meet" aria-hidden="true">'
        + '<g fill="url(#cf-cloud-grad)">'
        + '<ellipse cx="116" cy="92" rx="96" ry="26"/>'
        + '<circle cx="70" cy="74" r="30"/><circle cx="112" cy="56" r="42"/><circle cx="158" cy="72" r="32"/>'
        + '<circle cx="92" cy="82" r="28"/><circle cx="138" cy="82" r="26"/>'
        + '</g></svg>';
      const defs = [
        { top: 11, scale: 1.0,  dur: 62, delay: -6,  op: 0.97 },
        { top: 25, scale: 0.62, dur: 88, delay: -40, op: 0.72 },
        { top: 7,  scale: 0.82, dur: 74, delay: -56, op: 0.86 },
        { top: 39, scale: 1.16, dur: 98, delay: -18, op: 0.99 },
        { top: 18, scale: 0.46, dur: 66, delay: -76, op: 0.6 },
      ];
      clouds.innerHTML = grad + defs.map(d =>
        `<span class="cf-cloud" style="top:${d.top}%;--cs:${d.scale};opacity:${d.op};animation-duration:${d.dur}s;animation-delay:${d.delay}s;">${svg}</span>`
      ).join('');
    }
  }

  bindToggles() {
    const th = document.getElementById('cf-theme');
    if (th) th.addEventListener('click', () => this.applyTheme(this.theme === 'dark' ? 'light' : 'dark'));
    ['cf-lang-es','cf-lang-en'].forEach(id => { const b = document.getElementById(id); if (b) b.addEventListener('click', () => this.applyLang(b.dataset.lang)); });
  }

  initBotnav() {
    const btn = document.getElementById('cf-botmenu-btn');
    const menu = document.getElementById('cf-botmenu');
    const scrim = document.getElementById('cf-botscrim');
    if (!btn || !menu) return;
    const set = (o) => {
      btn.classList.toggle('is-open', o);
      menu.classList.toggle('is-open', o);
      btn.setAttribute('aria-expanded', o ? 'true' : 'false');
      menu.setAttribute('aria-hidden', o ? 'false' : 'true');
      if (scrim) scrim.classList.toggle('is-open', o);
    };
    btn.addEventListener('click', (e) => { e.stopPropagation(); set(!menu.classList.contains('is-open')); });
    if (scrim) scrim.addEventListener('click', () => set(false));
    menu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => set(false)));
    menu.querySelectorAll('.cf-blang').forEach(b => b.addEventListener('click', () => this.applyLang(b.dataset.lang)));
    document.querySelectorAll('.cf-botnav__item:not(.cf-botnav__menu)').forEach(it => {
      it.addEventListener('click', () => { it.classList.remove('is-pop'); void it.offsetWidth; it.classList.add('is-pop'); setTimeout(() => it.classList.remove('is-pop'), 650); });
    });
    addEventListener('keydown', (e) => { if (e.key === 'Escape') set(false); });
  }

  initCursor() {
    if (matchMedia('(hover:none),(pointer:coarse)').matches) return;
    const dot = document.getElementById('cf-cur-dot'), ring = document.getElementById('cf-cur-ring');
    if (!dot || !ring) return;
    let mx = innerWidth/2, my = innerHeight/2, dx = mx, dy = my, rx = mx, ry = my;
    addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
    const loop = () => { dx += (mx-dx)*.3; dy += (my-dy)*.3; rx += (mx-rx)*.15; ry += (my-ry)*.15;
      dot.style.left = dx+'px'; dot.style.top = dy+'px'; ring.style.left = rx+'px'; ring.style.top = ry+'px';
      requestAnimationFrame(loop); };
    loop();
    this._ring = ring;
    this.rebindCursor();
  }
  rebindCursor() {
    const ring = this._ring; if (!ring) return;
    const on = () => { ring.style.width = '64px'; ring.style.height = '64px'; ring.style.opacity = '1'; ring.style.borderColor = 'var(--accent)'; };
    const off = () => { ring.style.width = '13px'; ring.style.height = '13px'; ring.style.opacity = '0'; ring.style.borderColor = 'var(--border-strong)'; };
    document.querySelectorAll('a,button,.cf-case-foot__link,.cf-case-figure').forEach(el => { if (el._cb) return; el._cb = true; el.addEventListener('mouseenter', on); el.addEventListener('mouseleave', off); });
  }

  initNav() {
    document.querySelectorAll('.cf-navlink').forEach(a => {
      a.addEventListener('mouseenter', () => a.style.color = 'var(--text)');
      a.addEventListener('mouseleave', () => a.style.color = 'var(--text-muted)');
    });
    document.querySelectorAll('.cf-case-foot__link[href]').forEach(a => {
      a.addEventListener('click', () => {
        document.body.style.transition = 'opacity .35s var(--ease-out)';
        document.body.style.opacity = '0';
      });
    });
  }
}
new Component().componentDidMount();

</script>
</body>
